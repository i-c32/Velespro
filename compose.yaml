---
services:
  # ────────────────────────────────────────────────────────────────────────────
  # ENTORNO DE DESARROLLO
  # • Imagen con Neovim, git, nodejs, npm y paquetes [dev] de Python.
  # • El código se monta desde el host (edición en caliente).
  # • El venv vive dentro del contenedor (aislado del host).
  # ────────────────────────────────────────────────────────────────────────────
  dev:
    build:
      context: .
      dockerfile: Containerfile
      target: development
      args:
        # Pasa el UID/GID del host automáticamente
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"

    image: velespro:dev
    container_name: velespro_dev
    hostname: fedora-veles
    env_file: .env
    environment:
      - PYTHONPATH=/home/developer/workspace
      - MOD_PROMPT=\001\033[1;36m\002(Velespro-dev)\001\033[0m\002
    # 1. Mapeo de UID para evitar problemas de permisos en el host (Solo Podman)
    userns_mode: keep-id

    volumes:
      # Sincroniza la config de Neovim local
      - ./.config/nvim:/home/developer/.config/nvim:Z,ro
      # Sincroniza tu .bashrc
      - ./.config/bash/bashrc:/home/developer/.bashrc:Z,ro

      # Persistencia de plugins y estado
      - ./.data/fedora/nvim-data:/home/developer/.local/share/nvim:Z,U
      - ./.data/fedora/nvim-state:/home/developer/.local/state/nvim:Z,U

      # 3. HISTORIAL DE BASH (Para no perder tus comandos)
      - ./.data/.bash_history:/home/developer/.bash_history:Z

      # Tu código (Montamos la raíz para mantener la estructura project/src)
      - ./src:/home/developer/workspace/src:Z
      - ./tests:/home/developer/workspace/tests:Z
      - ./resources:/home/developer/workspace/resources:Z
      - ./.git:/home/developer/workspace/.git:Z,ro

    working_dir: /home/developer/workspace
    stdin_open: true
    tty: true

    # Reinicia solo si crashea, no si haces Ctrl+C
    restart: on-failure

  # ────────────────────────────────────────────────────────────────────────────
  # ENTORNO DE PRODUCCIÓN
  # • Imagen mínima: solo runtime de Python + código copiado en el build.
  # • Sin volúmenes de código: la app está baked-in en la imagen.
  # • Sin herramientas de desarrollo (Neovim, git, npm…).
  # ────────────────────────────────────────────────────────────────────────────
  prod:
    build:
      context: .
      dockerfile: Containerfile
      target: production           # apunta al stage "production"
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"

    image: velespro:prod
    container_name: velespro_prod
    hostname: fedora-veles-prod

    env_file: .env
    environment:
      - PYTHONPATH=/home/developer/workspace

    userns_mode: keep-id

    working_dir: /home/developer/workspace

    restart: unless-stopped        # en producción queremos auto-reinicio total
