[project]
name = "Velespro"
version = "0.1.0"
description = "Quantum chemistry program in python"
authors = [{ name = "Iván Veloso", email = "ivan.cluster32@gmail.com" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.8"

# Runtime dependencies
dependencies = [
    "numpy",
    "scipy",
    "pydantic",
]

[project.urls]
Repository = "https://github.com/i-c32/Velespro"

[project.optional-dependencies]
dev = [
    "debugpy",
    "scipy-stubs",
    "jupyterlab",
    "py3Dmol",
    "ipywidgets",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Nivel de compatibilidad de Python
target-version = "py314"
line-length = 111

[tool.ruff.lint]
# 1. EL COMBO ESTRICTO: Seleccionamos casi todo
# "ALL" activa literalmente todas las reglas disponibles
select = ["ALL"]

# 2. LAS EXCEPCIONES: Cosas que suelen chocar con el formateador
# o que son demasiado redundantes incluso para puristas.
ignore = [
    "D203",    # One blank line before class (conflicto con D211)
    "D213",    # Multi-line docstring summary start (conflicto con D212)
    "COM812",  # Trailing comma missing (conflicto con ruff format)
    "ISC001",  # Implicit string concatenation (conflicto con ruff format)
    "ANN101",  # Missing type annotation for 'self' (obsoleto en versiones nuevas)
]

[tool.ruff.lint.pylint]
max-args = 5 # No más de 5 argumentos por función

# 3. CONFIGURACIÓN ESPECÍFICA DE PLUGINS
[tool.ruff.lint.pydocstyle]
convention = "google" # Puedes usar "numpy" o "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10 # No permite funciones excesivamente enredadas

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true

[tool.ruff.format]
# Configuración del formateador para que sea consistente con Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src"]
extraPaths = ["src"]

# Opciones de entorno
useLibraryCodeForTypes = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
analyzeUnannotatedFunctions = true
strictParameterNoneValue = true
enableTypeIgnoreComments = true

