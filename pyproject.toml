[project]
name = "Velespro"
version = "0.1.0"
description = "Quantum chemistry program in python"
authors = [{ name = "Iván Veloso", email = "ivan.cluster32@gmail.com" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.8"

# Runtime dependencies
dependencies = [
    "pyhocon"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]